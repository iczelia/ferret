ferret_path           /var/log/ferret;   # writes YYYY-MM-DD.fer (UTC)
ferret_shm            ferret 64m;
ferret_block_size     8m;
ferret_flush_interval 10m;
ferret_xz_preset      6;
ferret_retention      -1;                          # days; -1 = keep forever

ferret_geo_db         /var/lib/ferret/dbip-city-lite.mmdb;
ferret_asn_db         /var/lib/ferret/dbip-asn-lite.mmdb;
ferret_intel_db       /var/lib/ferret/intel.bin;
ferret_hash_key       /etc/ferret/hash.key;

# reverse DNS (off by default); nginx resolver caches answers per worker
# resolver 127.0.0.53 valid=1h;
# ferret_rdns on;
# ferret_rdns_timeout 1s;

ferret_trap /.env /.git/ /wp-login.php /wp-admin/ /xmlrpc.php /phpmyadmin/;
